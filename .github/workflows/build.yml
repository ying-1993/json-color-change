name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PySide6-Addons screeninfo pillow pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name LottieColorTool lottie_color_tool.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LottieColorTool-Windows
          path: dist/LottieColorTool.exe
